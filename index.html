<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARIPOSAS</title>

    <style>
     *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
     }

     html,body{
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: arial,sans-serif;
     }

     body{
        background-image: url(https://estaticos-cdn.prensaiberica.es/clip/d5a464ff-e265-49ff-96d2-41286d033007_source-aspect-ratio_default_0.jpg);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
     }

     #app{
        position: relative;
        width: 100%;
        height: 100%;
     }

     #hero{
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%,-50%);
        z-index: 5;
        text-align: center;
        color: white;
        text-shadow: 0 0 10px black;
     }

     #author{
        position: fixed;
        bottom: 20px;
        width: 100%;
        text-align: center;
        color: white;
        font-size: 18px;
        letter-spacing: 3px;
        font-weight: bold;
        z-index: 10;
        text-shadow: 
         0 0 10px rgba(0,0,0,0.9),
         0 0 20px rgba(0,0,0,0.9);
     }
    </style>
</head>

<body>

    <div id="app"></div>

    <div id="author">💗 PARA ARIANA 💗</div>
    
    <!-- Agregué 'controls' temporalmente para verificar si el navegador carga el archivo -->
    <audio id="background-audio" loop autoplay>
        <source src="audiotiktik.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <script type="module">
        import {
            butterfliesBackground
        } from 'https://unpkg.com/threejs-toys@0.0.8/build/threejs-toys.module.cdn.min.js'

        const scene = butterfliesBackground({
            el: document.getElementById('app'),
            eventsEl: document.body,
            gpgpuSize: 18,
            background: 0x000000,
            material: 'phong',
            lights: [
                {
                    type: 'ambient',
                    params: [0xffffff, 0.7]
                },
                {
                    type: 'directional',
                    params: [0xffffff, 1],
                    props: {
                        position: [10, 0, 0]
                    }
                }
            ],
            materialParams: {
                transparent: true,
                alphaTest: 0.5
            },
            texture: 'https://assets.codepen.io/33787/butterflies.png',
            textureCount: 4,
            wingsScale: [2, 2, 2],
            wingsWidthSegments: 16,
            wingsHeightSegments: 16,
            wingsSpeed: 0.75,
            wingsDisplacementScale: 1.25,
            noiseCoordScale: 0.01,
            noiseTimeCoef: 0.0005,
            noiseIntensity: 0.0025,
            attractionRadius1: 100,
            attractionRadius2: 150,
            maxVelocity: 0.1,
        })
        
        setTimeout(() => {
            const canvas = document.querySelector("canvas");
            if(canvas){
                canvas.style.background = "transparent";
                const gl = canvas.getContext("webgl2") || canvas.getContext("webgl");
                if(gl) {
                    gl.clearColor(0,0,0,0);
                }
            }
        }, 500);

    </script>
</body>
</html>
